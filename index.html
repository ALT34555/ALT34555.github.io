<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>嘂 - 首页</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

    /* ===== 主题变量（与原站完全一致的 6 套配色） ===== */
    :root {
      --bg-color: #d1c2d3;
      --text-color: #7e1671;
      --border-color: #f9e9cd;
      --accent-color: #CB3A56;
      --header-text-color: #5c1052;
    }
    :root[data-tone="neutral"][data-mode="light"] {
      --bg-color: #d1c2d3; --text-color: #7e1671; --border-color: #f9e9cd; --accent-color: #CB3A56; --header-text-color: #5c1052;
    }
    :root[data-tone="neutral"][data-mode="dark"] {
      --bg-color: #815c94; --text-color: #fbecde; --border-color: #4f383e; --accent-color: #e77c8e; --header-text-color: #fbecde;
    }
    :root[data-tone="cool"][data-mode="light"] {
      --bg-color: #a7a8bd; --text-color: #2d0c13; --border-color: #5d3f51; --accent-color: #CB3A56; --header-text-color: #ffffff;
    }
    :root[data-tone="cool"][data-mode="dark"] {
      --bg-color: #525288; --text-color: #ccccd6; --border-color: #74759b; --accent-color: #e77c8e; --header-text-color: #ffffff;
    }
    :root[data-tone="warm"][data-mode="light"] {
      --bg-color: #c8adc4; --text-color: #4c1f24; --border-color: #9570a9; --accent-color: #CB3A56; --header-text-color: #ffffff;
    }
    :root[data-tone="warm"][data-mode="dark"] {
      --bg-color: #461629; --text-color: #ede3e7; --border-color: #b8a5d2; --accent-color: #e77c8e; --header-text-color: #380a1d;
    }

    /* ===== 基础 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      position: relative;
      transition: background-color 0.5s ease, color 0.5s ease;
      display: flex;
      flex-direction: column;
    }

    /* 顶部环境高光（沿用原站元素，增强玻璃氛围） */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 300px;
      background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* 底部 swoosh 装饰（沿用原站元素） */
    body::after {
      content: "";
      position: fixed;
      bottom: 0; left: 0; right: 0;
      width: 100vw;
      height: 25vh;
      background-image: url('icon_svg/aero_swoosh.svg');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: bottom center;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    /* ===== 氛围光斑背景（现代感） ===== */
    .orb {
      position: fixed;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
      transition: background 0.5s ease;
    }
    .orb-1 {
      width: 45vmax; height: 45vmax;
      top: -18vmax; right: -12vmax;
      background: radial-gradient(circle at 30% 30%, var(--accent-color), transparent 65%);
      opacity: 0.28;
      animation: drift 26s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 40vmax; height: 40vmax;
      bottom: -15vmax; left: -12vmax;
      background: radial-gradient(circle at 60% 60%, var(--border-color), transparent 65%);
      opacity: 0.45;
      animation: drift 32s ease-in-out infinite alternate-reverse;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(4vmax, 3vmax) scale(1.12); }
    }

    /* ===== 悬浮工具栏（直角玻璃） ===== */
    .toolbar {
      position: fixed;
      top: clamp(14px, 3vw, 26px);
      right: clamp(14px, 3vw, 30px);
      z-index: 50;
      animation: fadeDown 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .theme-controls {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 18px;
      border-radius: 0;
      /* 经典玻璃光泽：中部折光分界线 */
      background: linear-gradient(180deg,
        rgba(255,255,255,0.60) 0%,
        rgba(255,255,255,0.18) 45%,
        rgba(255,255,255,0.04) 50%,
        rgba(255,255,255,0.28) 100%);
      backdrop-filter: blur(18px) saturate(1.5);
      -webkit-backdrop-filter: blur(18px) saturate(1.5);
      border: 1px solid var(--border-color);
      box-shadow:
        0 8px 30px rgba(0,0,0,0.12),
        inset 0 1px 0 rgba(255,255,255,0.75),
        inset 0 -1px 0 rgba(255,255,255,0.18),
        inset 0 0 20px rgba(255,255,255,0.12);
      transition: border-color 0.3s ease;
    }

    /* 冷暖色调滑块（沿用原渐变色，现代化外观） */
    .tone-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 110px;
      height: 8px;
      border-radius: 0;
      background: linear-gradient(to right, #525288 0%, #a7a8bd 30%, #d1c2d3 50%, #c8adc4 70%, #CB3A56 100%);
      border: 1px solid rgba(0,0,0,0.12);
      outline: none;
      cursor: pointer;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.35);
    }
    .tone-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px; height: 22px;
      border-radius: 0;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.65) 100%);
      border: 2px solid var(--accent-color);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: transform 0.15s ease;
    }
    .tone-slider::-webkit-slider-thumb:hover { transform: scale(1.15); }
    .tone-slider::-moz-range-thumb {
      width: 8px; height: 18px;
      border-radius: 0;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.65) 100%);
      border: 2px solid var(--accent-color);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: transform 0.15s ease;
    }
    .tone-slider::-moz-range-thumb:hover { transform: scale(1.15); }

    /* 昼夜切换按钮（类名与原站一致，script.js 直接接管） */
    .mode-square-btn {
      width: 34px; height: 34px;
      border-radius: 0;
      background-color: var(--bg-color);
      background-image: linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.35) 100%);
      border: 2px solid var(--border-color);
      color: var(--text-color);
      font-size: 0.85rem;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12), inset 0 1px 1px rgba(255,255,255,0.4);
      transition: all 0.25s ease;
      user-select: none;
    }
    .mode-square-btn:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.18), inset 0 1px 1px rgba(255,255,255,0.6);
    }
    .mode-square-btn:active { transform: translateY(0) scale(0.95); }

    /* ===== 主布局（自适应比例） ===== */
    .main-content {
      position: relative;
      z-index: 10;
      flex: 1;
      width: min(1080px, 100% - clamp(32px, 6vw, 80px));
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(36px, 7vh, 72px);
      padding: clamp(90px, 14vh, 140px) 0 clamp(50px, 8vh, 90px);
    }

    /* ===== Hero ===== */
    .hero {
      text-align: center;
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .hero-title {
      font-size: clamp(4.5rem, 16vw, 9rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, var(--accent-color) 20%, var(--text-color) 90%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 6px 24px rgba(0,0,0,0.12));
      transition: filter 0.3s ease;
      user-select: none;
    }
    .hero-title:hover { filter: drop-shadow(0 8px 30px var(--accent-color)); }
    .hero-subtitle {
      margin-top: clamp(10px, 2vw, 18px);
      font-size: clamp(1rem, 2.6vw, 1.4rem);
      font-weight: 600;
      letter-spacing: 0.35em;
      text-indent: 0.35em;
      color: var(--header-text-color);
      opacity: 0.85;
    }
    .hero-divider {
      width: clamp(60px, 10vw, 110px);
      height: 3px;
      margin: clamp(16px, 3vw, 26px) auto 0;
      background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
    }

    /* ===== 卡片网格（自适应列数） ===== */
    .grid-layout {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      gap: clamp(16px, 2.5vw, 26px);
      width: 100%;
      /* 卡片按内容高度对齐：Fawtic 展开时同行卡片不被拉高 */
      align-items: start;
    }

    .minimal-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: clamp(26px, 4vw, 36px) clamp(20px, 3vw, 30px);
      border-radius: 0;
      text-decoration: none;
      text-align: center;
      color: var(--text-color);
      background: linear-gradient(135deg, rgba(255,255,255,0.48) 0%, rgba(255,255,255,0.12) 100%);
      backdrop-filter: blur(20px) saturate(1.5);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      border: 1px solid var(--border-color);
      box-shadow:
        0 10px 36px rgba(0,0,0,0.08),
        inset 0 1px 0 rgba(255,255,255,0.8),
        inset 0 -1px 0 rgba(255,255,255,0.18),
        inset 1px 0 0 rgba(255,255,255,0.28),
        inset 0 0 28px rgba(255,255,255,0.14);
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.35s ease,
                  border-color 0.35s ease;
      animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    /* 卡片依次入场 */
    .grid-layout .minimal-card:nth-child(1) { animation-delay: 0.15s; }
    .grid-layout .minimal-card:nth-child(2) { animation-delay: 0.25s; }
    .grid-layout .minimal-card:nth-child(3) { animation-delay: 0.35s; }
    .grid-layout .minimal-card:nth-child(4) { animation-delay: 0.45s; }
    .grid-layout .minimal-card:nth-child(5) { animation-delay: 0.55s; }
    .grid-layout .minimal-card:nth-child(6) { animation-delay: 0.65s; }

    /* 悬停高光扫过 */
    .minimal-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.7s ease;
      pointer-events: none;
    }
    .minimal-card:hover::before { transform: translateX(100%); }

    /* 上半部玻璃折光带（直角玻璃的标志性高光） */
    .minimal-card::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.38) 0%, rgba(255,255,255,0) 100%);
      border-bottom: 1px solid rgba(255,255,255,0.18);
      pointer-events: none;
    }

    .minimal-card:hover {
      transform: translateY(-7px);
      border-color: var(--accent-color);
      box-shadow: 0 20px 48px rgba(0,0,0,0.14),
                  0 0 0 1px var(--accent-color),
                  inset 0 1px 0 rgba(255,255,255,0.9),
                  inset 0 -1px 0 rgba(255,255,255,0.22),
                  inset 0 0 28px rgba(255,255,255,0.2);
    }
    .minimal-card:active { transform: translateY(-3px) scale(0.99); }

    .minimal-card .icon {
      font-size: 1.35rem;
      font-weight: 800;
      font-family: 'Consolas', 'Menlo', monospace;
      letter-spacing: 0.08em;
      color: var(--accent-color);
      padding: 12px 20px;
      border-radius: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.4) 100%);
      border: 1px solid var(--border-color);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.85), inset 0 -1px 0 rgba(255,255,255,0.2), 0 4px 12px rgba(0,0,0,0.08);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .minimal-card:hover .icon { transform: scale(1.08); }

    .minimal-card h3 {
      font-size: clamp(1.05rem, 2vw, 1.2rem);
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* 悬停箭头提示 */
    .card-arrow {
      position: absolute;
      top: 18px; right: 20px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-color);
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }
    .minimal-card:hover .card-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    /* ===== Fawtic 可展开卡片 ===== */
    /* 展开指示箭头（悬浮于右上角，与其他卡片的 → 位置一致，不占文档流） */
    .card-chevron {
      position: absolute;
      top: 18px; right: 20px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-color);
      opacity: 0.6;
      transition: transform 0.35s ease, opacity 0.3s ease;
      pointer-events: none;
    }
    #fawtic-card:hover .card-chevron { opacity: 1; }
    #fawtic-card.expanded .card-chevron { transform: rotate(180deg); opacity: 1; }

    .fawtic-links {
      display: grid;
      grid-template-rows: 0fr;
      width: 100%;
      /* 收起时以负边距抵消卡片 flex gap(14px)，保证与其他卡片完全同高 */
      margin-top: -14px;
      transition: grid-template-rows 0.45s cubic-bezier(0.22, 1, 0.36, 1), margin-top 0.45s ease;
    }
    #fawtic-card.expanded .fawtic-links {
      grid-template-rows: 1fr;
      margin-top: 0;
    }
    .fawtic-links-inner {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }
    .fawtic-links a {
      display: block;
      padding: 12px;
      border-radius: 0;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--text-color);
      background: linear-gradient(180deg, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0.45) 100%);
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: all 0.25s ease;
    }
    .fawtic-links a:hover {
      color: var(--accent-color);
      border-color: var(--accent-color);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }

    /* ===== 入场动画 ===== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== 小屏适配 ===== */
    @media (max-width: 640px) {
      .toolbar {
        top: 12px;
        right: 50%;
        transform: translateX(50%);
      }
      @keyframes fadeDown {
        from { opacity: 0; transform: translateX(50%) translateY(-20px); }
        to   { opacity: 1; transform: translateX(50%) translateY(0); }
      }
      .theme-controls { padding: 8px 14px; gap: 12px; }
      .tone-slider { width: 88px; }
      .hero-subtitle { letter-spacing: 0.2em; text-indent: 0.2em; }
    }

    /* 尊重减少动画偏好 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- 氛围光斑 -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- 悬浮工具栏：冷暖色调 + 昼夜切换（功能与原站一致，由 script.js 驱动） -->
  <div class="toolbar">
    <div class="theme-controls">
      <input type="range" min="-1" max="1" step="1" class="tone-slider" title="调整冷暖色调">
      <div class="mode-square-btn" title="切换深浅色">日</div>
    </div>
  </div>

  <div class="main-content">

    <!-- Hero -->
    <div class="hero">
      <h1 class="hero-title">嘂</h1>
      <div class="hero-subtitle">欢迎来到我的主页</div>
      <div class="hero-divider"></div>
    </div>

    <!-- 卡片网格 -->
    <div class="grid-layout">

      <!-- Fawtic（点击展开入口链接） -->
      <div class="minimal-card" id="fawtic-card" role="button" tabindex="0" aria-expanded="false" title="点击展开">
        <span class="card-chevron">▾</span>
        <div class="icon">[ FWT ]</div>
        <h3>Fawtic</h3>
        <div id="fawtic-links" class="fawtic-links">
          <div class="fawtic-links-inner">
            <a href="https://fawtic.vercel.app/" target="_blank" onclick="event.stopPropagation()">Vercel 入口</a>
            <a href="https://alt34555.johki.top/fawtic/" target="_blank" onclick="event.stopPropagation()">GitHub 入口</a>
          </div>
        </div>
      </div>

      <!-- 工具卡片（跳转目标与原站一致） -->
      <a href="./tools/jsonfix.html" class="minimal-card">
        <span class="card-arrow">→</span>
        <div class="icon">{ JSN }</div>
        <h3>JSON 修复</h3>
      </a>

      <a href="./tools/svg2png.html" class="minimal-card">
        <span class="card-arrow">→</span>
        <div class="icon">&lt; IMG &gt;</div>
        <h3>SVG 转 PNG</h3>
      </a>

      <a href="./tools/tupianpinjie.html" class="minimal-card">
        <span class="card-arrow">→</span>
        <div class="icon">[ + ]</div>
        <h3>图片拼接</h3>
      </a>

      <a href="./tools/wenbenqingli.html" class="minimal-card">
        <span class="card-arrow">→</span>
        <div class="icon">_ TXT _</div>
        <h3>文本清理</h3>
      </a>

      <a href="./tools/peise.html" class="minimal-card">
        <span class="card-arrow">→</span>
        <div class="icon">[ # ]</div>
        <h3>配色设计</h3>
      </a>

    </div>

  </div>

  <!-- 复用原站脚本：色调/昼夜/自动跟随系统/点击星光 -->
  <script src="script.js"></script>
  <script>
    // Fawtic 卡片展开/收起
    (function () {
      const card = document.getElementById('fawtic-card');
      if (!card) return;
      const toggle = () => {
        const expanded = card.classList.toggle('expanded');
        card.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      };
      card.addEventListener('click', toggle);
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggle();
        }
      });
    })();
  </script>
</body>
</html>
