<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>嘂 - 首页</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Specific overrides for the minimalist index layout */
    .center-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 100px);
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      gap: 50px;
    }
    
    .hero-title {
      font-size: 8rem;
      margin: 0;
      font-weight: 900;
      color: var(--accent-color);
      text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
      line-height: 1;
    }

    .hero-subtitle {
      font-size: 1.5rem;
      color: var(--header-text-color);
      margin-top: 10px;
      font-weight: 600;
      opacity: 0.8;
    }
    
    @media (max-width: 600px) {
      .hero-title {
        font-size: 6rem;
      }
    }
    
    .grid-layout {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      width: 100%;
    }

    @media (max-width: 600px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }
    }

    .minimal-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 100%);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      text-decoration: none;
      color: var(--text-color);
      box-shadow: 0 8px 32px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.6);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      cursor: pointer;
    }

    .minimal-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.8);
      border-color: var(--accent-color);
    }

    .minimal-card .icon {
      font-size: 3rem;
      line-height: 1;
    }

    .minimal-card h3 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
    }

    /* Style for color block buttons */
    .tone-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 0;
    }
    
    /* Clean Toolbar without backgrounds */
    .clean-toolbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: flex-end;
      padding: 20px 30px;
      z-index: 50;
    }

    .clean-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    #mode-toggle {
      background: transparent;
      border: none;
      box-shadow: none;
      font-size: 1.2rem;
      padding: 4px;
      cursor: pointer;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #mode-toggle:hover {
      transform: scale(1.1);
      background: transparent;
      box-shadow: none;
    }

    /* Direct link styles for Fawtic to prevent button nesting */
    .fawtic-links {
      display: none;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-top: 15px;
    }

    .fawtic-links a {
      background: linear-gradient(180deg, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.3) 100%);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 10px;
      text-decoration: none;
      color: var(--text-color);
      font-weight: 600;
      transition: all 0.2s;
    }

    .fawtic-links a:hover {
      background: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(255,255,255,0.5) 100%);
      transform: translateY(-2px);
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <!-- Top Right Toolbar -->
  <div class="clean-toolbar">
    <div class="theme-controls">
      <input type="range" min="-1" max="1" step="1" class="tone-slider" title="调整冷暖色调">
      <div class="mode-square-btn" title="切换深浅色">日</div>
    </div>
  </div>

  <div class="main-content center-layout">
    
    <!-- Hero Title -->
    <div style="text-align: center;">
      <h1 class="hero-title">嘂</h1>
      <div class="hero-subtitle">欢迎来到我的主页</div>
    </div>

    <div class="grid-layout">
      <!-- Fawtic (Expandable Card) -->
      <div class="minimal-card interactive-window" id="fawtic-card">
        <div class="icon" style="font-size: 1.5rem; font-weight: 800; font-family: monospace;">[ FWT ]</div>
        <h3>Fawtic</h3>
        <div id="fawtic-links" class="fawtic-links">
            <a href="https://fawtic.vercel.app/" target="_blank" onclick="event.stopPropagation()">Vercel 入口</a>
            <a href="https://alt34555.johki.top/fawtic/" target="_blank" onclick="event.stopPropagation()">GitHub 入口</a>
        </div>
      </div>

      <!-- Tools -->
      <a href="./tools/jsonfix.html" class="minimal-card interactive-window">
        <div class="icon" style="font-size: 1.5rem; font-weight: 800; font-family: monospace;">{ JSN }</div>
        <h3>JSON 修复</h3>
      </a>

      <a href="./tools/svg2png.html" class="minimal-card interactive-window">
        <div class="icon" style="font-size: 1.5rem; font-weight: 800; font-family: monospace;">&lt; IMG &gt;</div>
        <h3>SVG 转 PNG</h3>
      </a>

      <a href="./tools/tupianpinjie.html" class="minimal-card interactive-window">
        <div class="icon" style="font-size: 1.5rem; font-weight: 800; font-family: monospace;">[ + ]</div>
        <h3>图片拼接</h3>
      </a>

      <a href="./tools/wenbenqingli.html" class="minimal-card interactive-window">
        <div class="icon" style="font-size: 1.5rem; font-weight: 800; font-family: monospace;">_ TXT _</div>
        <h3>文本清理</h3>
      </a>

      <a href="./tools/peise.html" class="minimal-card interactive-window">
        <div class="icon" style="font-size: 1.5rem; font-weight: 800; font-family: monospace;">[ # ]</div>
        <h3>配色设计</h3>
      </a>
    </div>

  </div>

  <script src="script.js"></script>
  <script>
    // Expand Fawtic links on click
    const fawticCard = document.getElementById('fawtic-card');
    const fawticLinks = document.getElementById('fawtic-links');
    if (fawticCard && fawticLinks) {
      fawticCard.addEventListener('click', () => {
        fawticLinks.style.display = 'flex';
      });
    }
  </script>
</body>
</html>
