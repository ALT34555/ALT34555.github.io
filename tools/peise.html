<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配色设计 · 中国传统色</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
    <script>
        tailwind.config = { theme: { extend: { colors: {
            theme: 'var(--accent-color)', bg: 'var(--bg-color)',
            redAlert: '#CB3A56', redDark: '#82111f',
            blueAlt: 'var(--header-text-color)', whiteAlt: 'var(--border-color)',
            blackAlt: 'var(--text-color)'
        }}}}
    </script>
    <style>
        .color-cell {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 0;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            cursor: pointer;
            transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
        }
        .color-cell:hover,
        .color-cell:active {
            background: transparent;
            border-color: var(--text-color);
            transform: translateY(-2px);
            z-index: 2;
        }
        .color-cell .sw {
            height: 2.2rem;
            width: 100%;
            transition: opacity 0.15s ease;
        }
        .color-cell:hover .sw {
            opacity: 0.95;
        }
        .color-cell .nm {
            font-size: 0.62rem;
            padding: 0.2rem 0.1rem;
            text-align: center;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }
        .color-cell.active {
            border: 2px solid var(--text-color);
            box-shadow: 0 0 12px rgba(0,0,0,0.35);
            transform: scale(1.03);
            z-index: 5;
        }
        .palette-swatch {
            border: 1px solid var(--border-color);
            padding: 0.45rem 0.25rem;
            cursor: pointer;
            font-family: monospace;
            font-size: 0.7rem;
            font-weight: 600;
            text-align: center;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
            min-height: 3.4rem;
            justify-content: center;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            box-shadow: none;
            position: relative;
        }
        .palette-swatch:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            border-color: var(--text-color);
        }
        .cat-btn {
            padding: 0.3rem 0.65rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-color);
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .cat-btn:hover {
            border-color: var(--text-color);
            transform: translateY(-1px);
        }
        .cat-btn.active {
            background: var(--text-color);
            color: var(--bg-color);
            border-color: var(--text-color);
        }
        .val-badge {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.15s ease;
            cursor: pointer;
        }
        .val-badge:hover {
            transform: translateY(-1px);
            border-color: var(--text-color);
            background: rgba(255, 255, 255, 0.35);
        }
        .action-chip {
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.22);
            color: inherit;
            transition: all 0.15s ease;
        }
        .action-chip:hover {
            border-color: var(--text-color);
            background: rgba(255, 255, 255, 0.42);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden text-blackAlt">
    <!-- Global App Window Titlebar -->
    <div class="window-titlebar" style="border-top: none; border-left: none; border-right: none;">
        <div class="title-content">
            <span class="window-icon" style="font-size:1rem; font-weight:800; font-family:monospace;">[ # ]</span>
            <h2 class="window-title" style="font-size:1rem;">配色设计 · 中国传统色</h2>
        </div>
        <div class="window-controls">
            <div class="mode-square-btn" style="background:var(--text-color); color:var(--bg-color); border-color:var(--border-color);" onclick="window.location.href='../index.html'" title="返回首页">⚪</div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
        <!-- Top: main color + schemes -->
        <div class="grid grid-cols-1 lg:grid-cols-5 gap-4">
            <!-- 主色预览 -->
            <div class="lg:col-span-2 glass-card flex flex-col">
                <div id="mainCard" class="flex-1 flex flex-col items-center justify-center p-6 md:p-8 min-h-[300px] select-none transition-colors duration-300">
                    <div id="mainName" class="text-4xl md:text-5xl font-bold mb-1 tracking-widest font-serif leading-tight"></div>
                    <div id="mainPinyin" class="text-sm opacity-80 mb-4 font-mono tracking-wider"></div>
                    
                    <!-- HEX / RGB / CMYK Values Display Cards -->
                    <div class="grid grid-cols-3 gap-2 w-full max-w-sm mb-4">
                        <div id="badgeHex" class="val-badge p-2.5 text-center" title="点击复制 HEX 色值">
                            <div class="text-[10px] opacity-70 uppercase tracking-widest font-mono">HEX</div>
                            <div id="mainHex" class="font-mono text-sm sm:text-base font-bold tracking-wider"></div>
                        </div>
                        <div id="badgeRgb" class="val-badge p-2.5 text-center" title="点击复制 RGB 色值">
                            <div class="text-[10px] opacity-70 uppercase tracking-widest font-mono">RGB</div>
                            <div id="mainRgb" class="font-mono text-xs sm:text-sm font-semibold truncate"></div>
                        </div>
                        <div id="badgeCmyk" class="val-badge p-2.5 text-center" title="点击复制 CMYK 色值">
                            <div class="text-[10px] opacity-70 uppercase tracking-widest font-mono">CMYK</div>
                            <div id="mainCmyk" class="font-mono text-xs sm:text-sm font-semibold truncate"></div>
                        </div>
                    </div>

                    <!-- Quick Action Chips -->
                    <div class="flex flex-wrap items-center justify-center gap-2">
                        <button id="copyHexBtn" class="action-chip" title="复制 HEX 代码">复制 HEX</button>
                        <button id="copyRgbBtn" class="action-chip" title="复制 RGB 代码">复制 RGB</button>
                        <button id="copyCmykBtn" class="action-chip" title="复制 CMYK 色值">复制 CMYK</button>
                        <button id="copyCssBtn" class="action-chip" title="复制 CSS 规则">复制 CSS</button>
                        <button id="copyCardBtn" class="action-chip" title="复制完整色卡信息">复制色卡</button>
                    </div>
                    <div class="mt-3 text-center text-xs opacity-70">点击数值卡片或操作按钮即可一键复制</div>
                </div>
            </div>

            <!-- 配色方案 -->
            <div class="lg:col-span-3 glass-card">
                <div class="p-5 md:p-6 flex flex-col gap-4 h-full">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <div>
                            <h2 class="text-lg font-bold m-0">配色方案</h2>
                            <p class="text-xs opacity-70 mt-0.5">单色、邻近、互补、三角与传统五色 · 单击复制，双击设为主色</p>
                        </div>
                        <div class="flex gap-2">
                            <button id="randomBtn" class="px-3.5 py-1.5 text-sm font-bold transition-transform hover:-translate-y-px" style="background:var(--text-color); color:var(--bg-color);">随机配色</button>
                            <button id="locateMainBtn" class="px-3 py-1.5 text-sm font-bold transition-transform hover:-translate-y-px" style="background:var(--bg-color); color:var(--text-color); border:1px solid var(--text-color);" title="在颜色库中定位当前主色">定位主色</button>
                        </div>
                    </div>
                    <div id="paletteContainer" class="space-y-4 flex-1"></div>
                </div>
            </div>
        </div>

        <!-- 颜色库 -->
        <div class="glass-card">
            <!-- Header bar: Title, Search, Sort, Count -->
            <div class="p-4 border-b flex flex-wrap items-center gap-3" style="border-color:var(--border-color);">
                <div class="flex items-center gap-2">
                    <h2 class="text-lg font-bold m-0">传统颜色库</h2>
                    <span id="colorCount" class="text-xs px-2 py-0.5 rounded-none font-mono opacity-80" style="border: 1px solid var(--border-color); background: rgba(255,255,255,0.2);"></span>
                </div>
                <div class="flex-1 min-w-[200px] max-w-md ml-auto">
                    <input id="searchInput" type="text" placeholder="搜索颜色名 / 拼音 / HEX / RGB / CMYK" class="w-full bg-white border p-2 text-sm focus:outline-none focus:ring-2 focus:ring-theme" style="border-color:var(--border-color); color:#4c1f24;">
                </div>
                <select id="sortSelect" class="bg-white border p-2 text-sm focus:outline-none focus:ring-2 focus:ring-theme" style="border-color:var(--border-color); color:#4c1f24;">
                    <option value="default">默认顺序 (传统编排)</option>
                    <option value="pinyin">按拼音 (A → Z)</option>
                    <option value="color">按色相 (色相环)</option>
                    <option value="brightness-desc">按明度 (亮 → 暗)</option>
                    <option value="brightness-asc">按明度 (暗 → 亮)</option>
                    <option value="saturation-desc">按饱和度 (浓郁 → 雅淡)</option>
                    <option value="saturation-asc">按饱和度 (雅淡 → 浓郁)</option>
                </select>
            </div>

            <!-- Category Filter Tabs -->
            <div class="px-4 py-2.5 border-b flex items-center gap-1.5 overflow-x-auto" style="border-color:var(--border-color);" id="catFilterBar">
                <button class="cat-btn active" data-cat="all">全部 (751)</button>
                <button class="cat-btn" data-cat="red">红色系 (151)</button>
                <button class="cat-btn" data-cat="yellow">黄橙系 (181)</button>
                <button class="cat-btn" data-cat="green">绿色系 (85)</button>
                <button class="cat-btn" data-cat="blue">青蓝系 (133)</button>
                <button class="cat-btn" data-cat="purple">紫色系 (86)</button>
                <button class="cat-btn" data-cat="brown">棕褐系 (41)</button>
                <button class="cat-btn" data-cat="neutral">水墨灰黑白 (74)</button>
            </div>

            <!-- Color Grid -->
            <div id="colorGrid" class="p-4 grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 xl:grid-cols-12 gap-2 min-h-[200px]"></div>
        </div>
    </div>

    <div id="toast" class="restore-toast"></div>

["黄棕色", "huangzongse", "#C19A6B", "193,154,107", "0,20,44,24"],
["藕色", "ouse", "#D9C7B8", "217,199,184", "0,8,15,15"],
["石榴裙", "shiliuqun", "#E63946", "230,57,70", "0,75,69,10"],
["烟雨青", "yanyuqing", "#6A8D8C", "106,141,140", "25,0,1,45"],
["墨蓝", "molan", "#1E2D4C", "30,45,76", "61,41,0,70"],
["沙色", "shase", "#D9C7A9", "217,199,169", "0,8,22,15"],
["薰衣草紫", "xunyicaozi", "#B57EDC", "181,126,220", "18,43,0,14"]
        ];

        // ---- 颜色空间与计算工具函数 ----
        function hexToRgb(hex) {
            hex = hex.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            const n = parseInt(hex, 16);
            return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }

        function rgbToHex(r, g, b) {
            const to = c => Math.max(0, Math.min(255, Math.round(c))).toString(16).padStart(2, '0');
            return '#' + to(r) + to(g) + to(b);
        }

        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h = 0, s = 0, l = (max + min) / 2;
            const d = max - min;
            if (d !== 0) {
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) % 6; break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h *= 60;
            }
            return { h, s, l };
        }

        function hslToRgb(h, s, l) {
            h = ((h % 360) + 360) % 360;
            const c = (1 - Math.abs(2 * l - 1)) * s;
            const x = c * (1 - Math.abs((h / 60) % 2 - 1));
            const m = l - c / 2;
            let r = 0, g = 0, b = 0;
            if (h < 60) { r = c; g = x; }
            else if (h < 120) { r = x; g = c; }
            else if (h < 180) { r = g; b = x; }
            else if (h < 240) { g = x; b = c; }
            else if (h < 300) { r = x; b = c; }
            else { r = c; b = x; }
            return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
        }

        function brightness(hex) {
            const [r, g, b] = hexToRgb(hex);
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        }

        function textFor(hex) {
            return brightness(hex) > 0.5 ? '#4c1f24' : '#fbecde';
        }

        function mix(hex1, hex2, t) {
            const a = hexToRgb(hex1), b = hexToRgb(hex2);
            return rgbToHex(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t);
        }

        function clamp01(v) { return Math.max(0, Math.min(1, v)); }

        // CIE Lab 色彩空间转换（用于更精确的感知色彩距离）
        function rgbToLab(r, g, b) {
            const lin = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
            const rr = lin(r / 255), gg = lin(g / 255), bb = lin(b / 255);
            const X = rr * 0.4124 + gg * 0.3576 + bb * 0.1805;
            const Y = rr * 0.2126 + gg * 0.7152 + bb * 0.0722;
            const Z = rr * 0.0193 + gg * 0.1192 + bb * 0.9505;
            const f = t => t > 0.008856 ? Math.cbrt(t) : (7.787 * t + 16 / 116);
            const fx = f(X / 0.95047), fy = f(Y / 1.0), fz = f(Z / 1.08883);
            return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
        }

        // 色系智能分类
        function getColorCategory(hex) {
            const [r, g, b] = hexToRgb(hex);
            const { h, s, l } = rgbToHsl(r, g, b);
            if (l < 0.13) return 'neutral';
            if (l > 0.88 && s < 0.20) return 'neutral';
            if (s < 0.12) return 'neutral';
            if (h >= 15 && h <= 50 && s < 0.65 && l < 0.48) return 'brown';
            if (h >= 345 || h < 20) return 'red';
            if (h >= 20 && h < 70) return 'yellow';
            if (h >= 70 && h < 165) return 'green';
            if (h >= 165 && h < 260) return 'blue';
            if (h >= 260 && h < 345) return 'purple';
            return 'neutral';
        }

        // 预计算全部 751 个颜色的特征数据，提升排序与检索性能
        const COLOR_METAS = COLORS.map((c, i) => {
            const [name, pinyin, hex, rgb, cmyk] = c;
            const [r, g, b] = hexToRgb(hex);
            const hsl = rgbToHsl(r, g, b);
            const lab = rgbToLab(r, g, b);
            const bVal = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            const cat = getColorCategory(hex);
            return {
                index: i,
                name,
                pinyin,
                hex,
                rgb,
                cmyk,
                r, g, b,
                hsl,
                lab,
                brightness: bVal,
                category: cat
            };
        });

        // 快速在 751 色库中查找感知距离最近的传统色索引
        function nearestColorIndex(targetHex) {
            const [tr, tg, tb] = hexToRgb(targetHex);
            const [tl, ta, tbLab] = rgbToLab(tr, tg, tb);
            let bestIdx = 0, bestDist = Infinity;
            for (let i = 0; i < COLOR_METAS.length; i++) {
                const [l, a, bVal] = COLOR_METAS[i].lab;
                const dl = tl - l, da = ta - a, db = tbLab - bVal;
                const dist = dl * dl + da * da + db * db;
                if (dist < bestDist) {
                    bestDist = dist;
                    bestIdx = i;
                }
            }
            return bestIdx;
        }

        // ---- 配色方案生成算法 ----
        function makePalette(hex) {
            const [r, g, b] = hexToRgb(hex);
            const { h, s, l } = rgbToHsl(r, g, b);
            const hslHex = (H, S, L) => {
                const [rr, gg, bb] = hslToRgb(H, S, L);
                return rgbToHex(rr, gg, bb);
            };

            const nearestItem = hVal => {
                const targetH = hslHex(hVal.h, hVal.s, hVal.l);
                const idx = nearestColorIndex(targetH);
                return {
                    name: COLOR_METAS[idx].name,
                    pinyin: COLOR_METAS[idx].pinyin,
                    hex: COLOR_METAS[idx].hex,
                    rgb: COLOR_METAS[idx].rgb,
                    cmyk: COLOR_METAS[idx].cmyk,
                    index: idx
                };
            };

            const mono = [0.25, 0.12, 0, -0.12, -0.25].map(dl => nearestItem({ h, s, l: clamp01(l + dl) }));
            const analog = [-30, -15, 0, 15, 30].map(dh => nearestItem({ h: h + dh, s, l }));
            const complement = [0, 180].map(dh => nearestItem({ h: h + dh, s, l }));
            const triad = [0, 120, 240].map(dh => nearestItem({ h: h + dh, s, l }));

            // 传统五行五色关联与拓展方案
            const split = [0, 150, 210].map(dh => nearestItem({ h: h + dh, s, l }));
            const fiveColors = [
                mono[0],
                split[1],
                COLOR_METAS[currentIndex >= 0 ? currentIndex : 0],
                split[2],
                analog[4]
            ];

            return [
                { name: '单色搭配 (Monochrome)', items: mono },
                { name: '邻近雅色 (Analogous)', items: analog },
                { name: '互补对景 (Complementary)', items: complement },
                { name: '三角色彩 (Triadic)', items: triad },
                { name: '五色谱系 (Five-Color)', items: fiveColors }
            ];
        }

        // ---- 状态管理 ----
        let currentIndex = -1;
        let currentCategory = 'all';
        window.__currentHex = '';

        const els = {
            mainCard: document.getElementById('mainCard'),
            mainName: document.getElementById('mainName'),
            mainPinyin: document.getElementById('mainPinyin'),
            mainHex: document.getElementById('mainHex'),
            mainRgb: document.getElementById('mainRgb'),
            mainCmyk: document.getElementById('mainCmyk'),
            badgeHex: document.getElementById('badgeHex'),
            badgeRgb: document.getElementById('badgeRgb'),
            badgeCmyk: document.getElementById('badgeCmyk'),
            copyHexBtn: document.getElementById('copyHexBtn'),
            copyRgbBtn: document.getElementById('copyRgbBtn'),
            copyCmykBtn: document.getElementById('copyCmykBtn'),
            copyCssBtn: document.getElementById('copyCssBtn'),
            copyCardBtn: document.getElementById('copyCardBtn'),
            paletteContainer: document.getElementById('paletteContainer'),
            colorGrid: document.getElementById('colorGrid'),
            colorCount: document.getElementById('colorCount'),
            searchInput: document.getElementById('searchInput'),
            sortSelect: document.getElementById('sortSelect'),
            catFilterBar: document.getElementById('catFilterBar'),
            randomBtn: document.getElementById('randomBtn'),
            locateMainBtn: document.getElementById('locateMainBtn'),
            toast: document.getElementById('toast')
        };

        let toastTimer = null;
        function showToast(msg) {
            els.toast.textContent = msg;
            els.toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => els.toast.classList.remove('show'), 1600);
        }

        function copyText(text, successMsg) {
            if (!text) return;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showToast(successMsg || '已复制到剪贴板'));
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast(successMsg || '已复制到剪贴板');
                } catch (e) {
                    showToast('复制失败');
                }
                document.body.removeChild(ta);
            }
        }

        function copyHex(hex) {
            copyText(hex, '已复制 HEX: ' + hex);
        }

        function copyRgb(rgb) {
            const val = rgb.startsWith('rgb') ? rgb : 'rgb(' + rgb + ')';
            copyText(val, '已复制 RGB: ' + val);
        }

        function copyCmyk(cmyk) {
            const parts = cmyk.split(',');
            const val = parts.length === 4 ? `cmyk(${parts[0]}%, ${parts[1]}%, ${parts[2]}%, ${parts[3]}%)` : cmyk;
            copyText(val, '已复制 CMYK: ' + val);
        }

        function copyCss() {
            if (currentIndex < 0) return;
            const c = COLOR_METAS[currentIndex];
            const textC = textFor(c.hex);
            const css = `/* 中国传统色 · ${c.name} (${c.pinyin}) */
--color-${c.pinyin}: ${c.hex};
background-color: ${c.hex};
color: ${textC};`;
            copyText(css, '已复制 CSS 代码');
        }

        function copyFullCard() {
            if (currentIndex < 0) return;
            const c = COLOR_METAS[currentIndex];
            const text = `【中国传统色 · ${c.name}】
拼音: ${c.pinyin}
HEX: ${c.hex}
RGB: rgb(${c.rgb})
CMYK: ${c.cmyk}`;
            copyText(text, '已复制完整色卡信息');
        }

        // 应用主题色及主色信息呈现
        function applyTheme(index) {
            if (index < 0 || index >= COLOR_METAS.length) return;
            currentIndex = index;
            const c = COLOR_METAS[index];
            const text = textFor(c.hex);
            const border = mix(c.hex, text, 0.5);
            window.__currentHex = c.hex;

            const root = document.documentElement;
            root.style.setProperty('--bg-color', c.hex);
            root.style.setProperty('--text-color', text);
            root.style.setProperty('--accent-color', text);
            root.style.setProperty('--header-text-color', text);
            root.style.setProperty('--border-color', border);

            // 主色预览卡片更新
            els.mainCard.style.background = c.hex;
            els.mainCard.style.color = text;
            els.mainName.textContent = c.name;
            els.mainPinyin.textContent = c.pinyin;
            els.mainHex.textContent = c.hex;
            els.mainRgb.textContent = c.rgb;
            els.mainCmyk.textContent = c.cmyk;

            // 配色方案更新
            renderPalette(c.hex);

            // 高亮当前颜色格子
            Array.from(els.colorGrid.children).forEach(cell => {
                cell.classList.toggle('active', parseInt(cell.dataset.index, 10) === index);
            });
        }

        // 渲染配色方案区域
        function renderPalette(hex) {
            const palette = makePalette(hex);
            els.paletteContainer.innerHTML = '';

            palette.forEach(group => {
                const wrap = document.createElement('div');

                const titleRow = document.createElement('div');
                titleRow.className = 'flex items-center justify-between mb-1.5';
                
                const title = document.createElement('div');
                title.className = 'text-xs font-semibold';
                title.textContent = group.name;
                titleRow.appendChild(title);

                // 一键复制该组色值按钮
                const copyGroupBtn = document.createElement('button');
                copyGroupBtn.className = 'text-[11px] opacity-75 hover:opacity-100 underline cursor-pointer';
                copyGroupBtn.textContent = '复制此组';
                copyGroupBtn.title = '复制该配色方案全部 HEX 色值';
                copyGroupBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const hexList = group.items.map(item => item.hex).join(', ');
                    copyText(hexList, '已复制 ' + group.name + ' 色值列表');
                });
                titleRow.appendChild(copyGroupBtn);
                wrap.appendChild(titleRow);

                const row = document.createElement('div');
                row.className = 'grid gap-2';
                row.style.gridTemplateColumns = 'repeat(' + group.items.length + ', minmax(0,1fr))';

                group.items.forEach(item => {
                    const sw = document.createElement('button');
                    sw.className = 'palette-swatch';
                    sw.style.background = item.hex;
                    sw.style.color = textFor(item.hex);
                    sw.style.borderColor = 'var(--border-color)';
                    sw.title = `${item.name ? item.name + ' (' + item.pinyin + ')\n' : ''}HEX: ${item.hex}\nRGB: ${item.rgb || hexToRgb(item.hex).join(',')}\nCMYK: ${item.cmyk || '-'}\n[单击复制 HEX · 双击设为主色]`;

                    if (item.name) {
                        const nmEl = document.createElement('span');
                        nmEl.style.fontSize = '0.62rem';
                        nmEl.style.fontFamily = 'sans-serif';
                        nmEl.style.fontWeight = '600';
                        nmEl.style.whiteSpace = 'nowrap';
                        nmEl.style.overflow = 'hidden';
                        nmEl.style.textOverflow = 'ellipsis';
                        nmEl.style.maxWidth = '100%';
                        nmEl.textContent = item.name;
                        sw.appendChild(nmEl);
                    }

                    const hxEl = document.createElement('span');
                    hxEl.textContent = item.hex;
                    sw.appendChild(hxEl);

                    // 单击复制色值，双击设为主色
                    let clickTimeout = null;
                    sw.addEventListener('click', () => {
                        if (clickTimeout) clearTimeout(clickTimeout);
                        clickTimeout = setTimeout(() => {
                            copyHex(item.hex);
                        }, 220);
                    });
                    sw.addEventListener('dblclick', (e) => {
                        e.preventDefault();
                        if (clickTimeout) clearTimeout(clickTimeout);
                        if (typeof item.index === 'number') {
                            applyTheme(item.index);
                            showToast('已切换主色为: ' + item.name);
                        } else {
                            const idx = nearestColorIndex(item.hex);
                            applyTheme(idx);
                        }
                    });

                    row.appendChild(sw);
                });

                wrap.appendChild(row);
                els.paletteContainer.appendChild(wrap);
            });
        }

        // 渲染 751 色库栅格（带分类、搜索、排序优化）
        function renderGrid() {
            els.colorGrid.innerHTML = '';
            const q = els.searchInput.value.trim().toLowerCase();
            const mode = els.sortSelect.value;

            // 过滤匹配
            const indices = [];
            for (let i = 0; i < COLOR_METAS.length; i++) {
                const m = COLOR_METAS[i];
                if (currentCategory !== 'all' && m.category !== currentCategory) {
                    continue;
                }
                if (q) {
                    const matchName = m.name.toLowerCase().includes(q);
                    const matchPinyin = m.pinyin.toLowerCase().includes(q);
                    const matchHex = m.hex.toLowerCase().includes(q) || m.hex.toLowerCase().replace('#', '').includes(q);
                    const matchRgb = m.rgb.includes(q);
                    const matchCmyk = m.cmyk.includes(q);
                    if (!matchName && !matchPinyin && !matchHex && !matchRgb && !matchCmyk) continue;
                }
                indices.push(i);
            }

            // 排序模式处理
            if (mode !== 'default') {
                indices.sort((a, b) => {
                    const ma = COLOR_METAS[a];
                    const mb = COLOR_METAS[b];
                    if (mode === 'pinyin') {
                        return ma.pinyin.localeCompare(mb.pinyin, 'zh');
                    }
                    if (mode === 'color') {
                        if (ma.hsl.h !== mb.hsl.h) return ma.hsl.h - mb.hsl.h;
                        return ma.hsl.l - mb.hsl.l;
                    }
                    if (mode === 'brightness-desc') {
                        return mb.brightness - ma.brightness;
                    }
                    if (mode === 'brightness-asc') {
                        return ma.brightness - mb.brightness;
                    }
                    if (mode === 'saturation-desc') {
                        return mb.hsl.s - ma.hsl.s;
                    }
                    if (mode === 'saturation-asc') {
                        return ma.hsl.s - mb.hsl.s;
                    }
                    return 0;
                });
            }

            // 使用 DocumentFragment 批量挂载，保证渲染极速流畅
            const frag = document.createDocumentFragment();
            let shown = 0;

            indices.forEach(i => {
                shown++;
                const m = COLOR_METAS[i];
                const cell = document.createElement('button');
                cell.className = 'color-cell';
                cell.dataset.index = i;
                cell.title = `【${m.name} · ${m.pinyin}】\nHEX: ${m.hex}\nRGB: ${m.rgb}\nCMYK: ${m.cmyk}\n[点击应用为当前主色]`;

                const sw = document.createElement('span');
                sw.className = 'sw';
                sw.style.background = m.hex;

                const nm = document.createElement('span');
                nm.className = 'nm';
                nm.textContent = m.name;

                cell.appendChild(sw);
                cell.appendChild(nm);
                cell.addEventListener('click', () => applyTheme(i));

                if (i === currentIndex) {
                    cell.classList.add('active');
                }

                frag.appendChild(cell);
            });

            els.colorGrid.appendChild(frag);
            els.colorCount.textContent = shown === COLOR_METAS.length ? `共 ${shown} 色` : `${shown} / ${COLOR_METAS.length} 色`;
        }

        // 定位并滚动至当前选中的主色
        function locateMainColor() {
            if (currentIndex < 0) return;
            // 如果被筛选或搜索隐藏了，先重置筛选以便看到它
            const curMeta = COLOR_METAS[currentIndex];
            let needReRender = false;
            if (currentCategory !== 'all' && curMeta.category !== currentCategory) {
                currentCategory = 'all';
                Array.from(els.catFilterBar.children).forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.cat === 'all');
                });
                needReRender = true;
            }
            if (els.searchInput.value.trim()) {
                els.searchInput.value = '';
                needReRender = true;
            }
            if (needReRender) {
                renderGrid();
            }

            setTimeout(() => {
                const cell = els.colorGrid.querySelector(`[data-index="${currentIndex}"]`);
                if (cell) {
                    cell.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    cell.classList.add('active');
                    showToast('已定位到: ' + curMeta.name);
                }
            }, 50);
        }

        // ---- 事件绑定 ----
        els.randomBtn.addEventListener('click', () => {
            // 若当前有筛选，优先在已筛选结果中随机挑选
            const cells = els.colorGrid.children;
            if (cells.length > 0) {
                const randCell = cells[Math.floor(Math.random() * cells.length)];
                const idx = parseInt(randCell.dataset.index, 10);
                applyTheme(idx);
                showToast('已随机挑选: ' + COLOR_METAS[idx].name);
            } else {
                const randIdx = Math.floor(Math.random() * COLOR_METAS.length);
                applyTheme(randIdx);
                showToast('已随机挑选: ' + COLOR_METAS[randIdx].name);
            }
        });

        els.locateMainBtn.addEventListener('click', locateMainColor);

        // 主色值卡片点击一键复制
        els.badgeHex.addEventListener('click', () => copyHex(window.__currentHex));
        els.badgeRgb.addEventListener('click', () => {
            if (currentIndex >= 0) copyRgb(COLOR_METAS[currentIndex].rgb);
        });
        els.badgeCmyk.addEventListener('click', () => {
            if (currentIndex >= 0) copyCmyk(COLOR_METAS[currentIndex].cmyk);
        });

        // 按钮点击复制
        els.copyHexBtn.addEventListener('click', () => copyHex(window.__currentHex));
        els.copyRgbBtn.addEventListener('click', () => {
            if (currentIndex >= 0) copyRgb(COLOR_METAS[currentIndex].rgb);
        });
        els.copyCmykBtn.addEventListener('click', () => {
            if (currentIndex >= 0) copyCmyk(COLOR_METAS[currentIndex].cmyk);
        });
        els.copyCssBtn.addEventListener('click', copyCss);
        els.copyCardBtn.addEventListener('click', copyFullCard);

        // 搜索与排序
        els.searchInput.addEventListener('input', renderGrid);
        els.sortSelect.addEventListener('change', renderGrid);

        // 色系分类按钮点击
        els.catFilterBar.addEventListener('click', (e) => {
            const btn = e.target.closest('.cat-btn');
            if (!btn) return;
            Array.from(els.catFilterBar.children).forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = btn.dataset.cat;
            renderGrid();
        });

        // ---- 初始化 ----
        renderGrid();
        // 随机一个默认主色
        applyTheme(Math.floor(Math.random() * COLOR_METAS.length));
    </script>
    <script src="../script.js"></script>
</body>
</html>
