<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配色设计</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
    <script>
        tailwind.config = { theme: { extend: { colors: {
            theme: 'var(--accent-color)', bg: 'var(--bg-color)',
            redAlert: '#CB3A56', redDark: '#82111f',
            blueAlt: 'var(--header-text-color)', whiteAlt: 'var(--border-color)',
            blackAlt: 'var(--text-color)'
        }}}}
    </script>
    <style>
        .color-cell {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 0;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            cursor: pointer;
        }
        .color-cell:hover,
        .color-cell:active {
            background: transparent;
            border-color: var(--text-color);
            transform: translateY(-1px);
        }
        .color-cell .sw { height: 2.4rem; }
        .color-cell .nm {
            font-size: 0.62rem;
            padding: 0.2rem 0.15rem;
            text-align: center;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }
        .color-cell.active {
            border: 2px solid var(--text-color);
            box-shadow: 0 0 10px rgba(0,0,0,0.35);
            padding: 0;
        }
        .palette-swatch {
            border: 1px solid var(--border-color);
            padding: 0.5rem 0.25rem;
            cursor: pointer;
            font-family: monospace;
            font-size: 0.7rem;
            font-weight: 600;
            text-align: center;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
            min-height: 3.2rem;
            justify-content: center;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            box-shadow: none;
        }
        .palette-swatch:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden text-blackAlt">
    <!-- Global App Window Titlebar -->
    <div class="window-titlebar" style="border-top: none; border-left: none; border-right: none;">
        <div class="title-content">
            <span class="window-icon" style="font-size:1rem; font-weight:800; font-family:monospace;">[ # ]</span>
            <h2 class="window-title" style="font-size:1rem;">配色设计</h2>
        </div>
        <div class="window-controls">
            <div class="mode-square-btn" style="background:var(--text-color); color:var(--bg-color); border-color:var(--border-color);" onclick="window.location.href='../index.html'" title="返回首页">⚪</div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
        <!-- Top: main color + schemes -->
        <div class="grid grid-cols-1 lg:grid-cols-5 gap-4">
            <!-- 主色预览 -->
            <div class="lg:col-span-2 glass-card">
                <div id="mainCard" class="flex-1 flex flex-col items-center justify-center p-8 min-h-[260px] cursor-pointer select-none" onclick="copyHex(window.__currentHex)" title="点击复制色值">
                    <div id="mainName" class="text-4xl font-bold mb-1 leading-tight"></div>
                    <div id="mainPinyin" class="text-sm opacity-70 mb-3 font-mono"></div>
                    <div id="mainHex" class="text-2xl font-mono tracking-widest uppercase"></div>
                    <div class="mt-6 text-center text-sm opacity-80">点击复制 HEX 色值</div>
                </div>
            </div>

            <!-- 配色方案 -->
            <div class="lg:col-span-3 glass-card">
                <div class="p-6 flex flex-col gap-4 h-full">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <h2 class="text-lg">配色方案</h2>
                        <div class="flex gap-2">
                            <button id="randomBtn" class="px-4 py-2 font-bold transition-transform hover:-translate-y-px" style="background:var(--text-color); color:var(--bg-color);">随机配色</button>
                            <button id="copyMainBtn" class="px-4 py-2 font-bold transition-transform hover:-translate-y-px" style="background:var(--bg-color); color:var(--text-color); border:1px solid var(--text-color);">复制 HEX</button>
                        </div>
                    </div>
                    <div id="paletteContainer" class="space-y-5 flex-1"></div>
                </div>
            </div>
        </div>

        <!-- 颜色库 -->
        <div class="glass-card">
            <div class="p-4 border-b flex flex-wrap items-center gap-3" style="border-color:var(--border-color);">
                <h2 class="text-lg m-0">颜色库</h2>
                <div class="flex-1 min-w-[180px] max-w-sm ml-auto">
                    <input id="searchInput" type="text" placeholder="搜索颜色名 / 拼音" class="w-full bg-white border p-2 text-sm focus:outline-none focus:ring-2 focus:ring-theme" style="border-color:var(--border-color); color:#4c1f24;">
                </div>
                <span id="colorCount" class="text-xs opacity-70"></span>
            </div>
            <div id="colorGrid" class="p-4 grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 xl:grid-cols-12 gap-2"></div>
        </div>
    </div>

    <div id="toast" class="restore-toast"></div>

        // ---- 颜色工具函数 ----
        function hexToRgb(hex) {
            hex = hex.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            const n = parseInt(hex, 16);
            return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }
        function rgbToHex(r, g, b) {
            const to = c => Math.round(c).toString(16).padStart(2, '0');
            return '#' + to(r) + to(g) + to(b);
        }
        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h = 0, s = 0, l = (max + min) / 2;
            const d = max - min;
            if (d !== 0) {
                s = d / (1 - Math.abs(2 * l - 1));
                switch (max) {
                    case r: h = ((g - b) / d) % 6; break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h *= 60;
                if (h < 0) h += 360;
            }
            return { h, s, l };
        }
        function hslToRgb(h, s, l) {
            h = ((h % 360) + 360) % 360;
            const c = (1 - Math.abs(2 * l - 1)) * s;
            const x = c * (1 - Math.abs((h / 60) % 2 - 1));
            const m = l - c / 2;
            let r = 0, g = 0, b = 0;
            if (h < 60) { r = c; g = x; }
            else if (h < 120) { r = x; g = c; }
            else if (h < 180) { g = c; b = x; }
            else if (h < 240) { g = x; b = c; }
            else if (h < 300) { r = x; b = c; }
            else { r = c; b = x; }
            return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
        }
        // 明度（简单感知亮度），用于决定文字颜色
        function brightness(hex) {
            const [r, g, b] = hexToRgb(hex);
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        }
        function textFor(hex) {
            return brightness(hex) > 0.5 ? '#4c1f24' : '#fbecde';
        }
        function mix(hex1, hex2, t) {
            const a = hexToRgb(hex1), b = hexToRgb(hex2);
            return rgbToHex(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t);
        }
        function clamp01(v) { return Math.max(0, Math.min(1, v)); }

        // 感知色彩距离（CIE Lab ΔE），用于在颜色列表里查找最接近的颜色
        function rgbToLab(r, g, b) {
            const lin = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
            const rr = lin(r / 255), gg = lin(g / 255), bb = lin(b / 255);
            const X = rr * 0.4124 + gg * 0.3576 + bb * 0.1805;
            const Y = rr * 0.2126 + gg * 0.7152 + bb * 0.0722;
            const Z = rr * 0.0193 + gg * 0.1192 + bb * 0.9505;
            const f = t => t > 0.008856 ? Math.cbrt(t) : (7.787 * t + 16 / 116);
            const fx = f(X / 0.95047), fy = f(Y / 1.0), fz = f(Z / 1.08883);
            return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
        }
        function deltaE(hex1, hex2) {
            const a = rgbToLab(...hexToRgb(hex1));
            const b = rgbToLab(...hexToRgb(hex2));
            const dl = a[0] - b[0], da = a[1] - b[1], db = a[2] - b[2];
            return Math.sqrt(dl * dl + da * da + db * db);
        }
        function nearestColorIndex(hex) {
            let best = 0, bestD = Infinity;
            for (let i = 0; i < COLORS.length; i++) {
                const d = deltaE(hex, COLORS[i][2]);
                if (d < bestD) { bestD = d; best = i; }
            }
            return best;
        }

        // ---- 配色方案生成 ----
        function makePalette(hex) {
            const [r, g, b] = hexToRgb(hex);
            const { h, s, l } = rgbToHsl(r, g, b);
            const hslHex = (H, S, L) => { const [rr, gg, bb] = hslToRgb(H, S, L); return rgbToHex(rr, gg, bb); };
            const gen = items => items.map(c => ({ name: '', hex: hslHex(c.h, c.s, c.l) }));
            const nearest = items => items.map(c => {
                const i = nearestColorIndex(hslHex(c.h, c.s, c.l));
                return { name: COLORS[i][0], hex: COLORS[i][2] };
            });
            const nearestOf = c => {
                const i = nearestColorIndex(hslHex(c.h, c.s, c.l));
                return { name: COLORS[i][0], hex: COLORS[i][2] };
            };

            const mono = [0.25, 0.12, 0, -0.12, -0.25].map(dl => ({ h, s, l: clamp01(l + dl) }));
            const analog = [-30, -15, 0, 15, 30].map(dh => ({ h: h + dh, s, l }));
            const split = [0, 150, 210].map(dh => ({ h: h + dh, s, l }));

            return [
                { name: '单色配色', items: gen(mono) },
                { name: '邻近色', items: gen(analog) },
                { name: '最近互补色', items: nearest([0, 180].map(dh => ({ h: h + dh, s, l }))) },
                { name: '最相似三角', items: nearest([0, 120, 240].map(dh => ({ h: h + dh, s, l }))) },
                { name: '五色', items: [
                    nearestOf(mono[0]),
                    nearestOf(split[1]),
                    { name: COLORS[currentIndex][0], hex: hex },
                    nearestOf(split[2]),
                    nearestOf(analog[4])
                ]}
            ];
        }

        // ---- 状态 ----
        let currentIndex = -1;
        window.__currentHex = '';

        const els = {
            mainCard: document.getElementById('mainCard'),
            mainName: document.getElementById('mainName'),
            mainPinyin: document.getElementById('mainPinyin'),
            mainHex: document.getElementById('mainHex'),
            paletteContainer: document.getElementById('paletteContainer'),
            colorGrid: document.getElementById('colorGrid'),
            colorCount: document.getElementById('colorCount'),
            searchInput: document.getElementById('searchInput'),
            randomBtn: document.getElementById('randomBtn'),
            copyMainBtn: document.getElementById('copyMainBtn'),
            toast: document.getElementById('toast')
        };

        let toastTimer = null;
        function showToast(msg) {
            els.toast.textContent = msg;
            els.toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => els.toast.classList.remove('show'), 1500);
        }

        function copyHex(hex) {
            if (!hex) return;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(hex).then(() => showToast('已复制 ' + hex));
            } else {
                const ta = document.createElement('textarea');
                ta.value = hex;
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); showToast('已复制 ' + hex); }
                catch (e) { showToast('复制失败'); }
                document.body.removeChild(ta);
            }
        }

        function applyTheme(index) {
            currentIndex = index;
            const [name, pinyin, hex] = COLORS[index];
            const text = textFor(hex);
            const border = mix(hex, text, 0.5);
            window.__currentHex = hex;

            const root = document.documentElement;
            root.style.setProperty('--bg-color', hex);
            root.style.setProperty('--text-color', text);
            root.style.setProperty('--accent-color', text);
            root.style.setProperty('--header-text-color', text);
            root.style.setProperty('--border-color', border);

            // 主色预览
            els.mainCard.style.background = hex;
            els.mainCard.style.color = text;
            els.mainName.textContent = name;
            els.mainPinyin.textContent = pinyin;
            els.mainHex.textContent = hex;

            // 配色方案
            renderPalette(hex);

            // 高亮当前颜色
            Array.from(els.colorGrid.children).forEach(cell => {
                cell.classList.toggle('active', parseInt(cell.dataset.index, 10) === index);
            });
        }

        function renderPalette(hex) {
            const palette = makePalette(hex);
            els.paletteContainer.innerHTML = '';
            palette.forEach(group => {
                const wrap = document.createElement('div');
                const title = document.createElement('div');
                title.className = 'text-sm font-semibold mb-2';
                title.textContent = group.name;
                wrap.appendChild(title);

                const row = document.createElement('div');
                row.className = 'grid gap-2';
                row.style.gridTemplateColumns = 'repeat(' + group.items.length + ', minmax(0,1fr))';
                group.items.forEach(item => {
                    const sw = document.createElement('button');
                    sw.className = 'palette-swatch';
                    sw.style.background = item.hex;
                    sw.style.color = textFor(item.hex);
                    sw.style.borderColor = 'var(--border-color)';
                    sw.title = '点击复制 ' + item.hex;
                    if (item.name) {
                        const nmEl = document.createElement('span');
                        nmEl.style.fontSize = '0.62rem';
                        nmEl.style.fontFamily = 'sans-serif';
                        nmEl.style.fontWeight = '600';
                        nmEl.style.whiteSpace = 'nowrap';
                        nmEl.style.overflow = 'hidden';
                        nmEl.style.textOverflow = 'ellipsis';
                        nmEl.style.maxWidth = '100%';
                        nmEl.textContent = item.name;
                        sw.appendChild(nmEl);
                    }
                    const hxEl = document.createElement('span');
                    hxEl.textContent = item.hex;
                    sw.appendChild(hxEl);
                    sw.addEventListener('click', () => copyHex(item.hex));
                    row.appendChild(sw);
                });
                wrap.appendChild(row);
                els.paletteContainer.appendChild(wrap);
            });
        }

        function renderGrid() {
            els.colorGrid.innerHTML = '';
            const q = els.searchInput.value.trim().toLowerCase();
            let shown = 0;
            COLORS.forEach((c, i) => {
                const [name, pinyin, hex] = c;
                if (q && name.toLowerCase().indexOf(q) === -1 && pinyin.toLowerCase().indexOf(q) === -1) return;
                shown++;
                const cell = document.createElement('button');
                cell.className = 'color-cell';
                cell.dataset.index = i;
                cell.title = name + ' ' + pinyin + ' ' + hex;

                const sw = document.createElement('span');
                sw.className = 'sw';
                sw.style.background = hex;
                const nm = document.createElement('span');
                nm.className = 'nm';
                nm.textContent = name;

                cell.appendChild(sw);
                cell.appendChild(nm);
                cell.addEventListener('click', () => applyTheme(i));
                els.colorGrid.appendChild(cell);
            });
            els.colorCount.textContent = shown + ' / ' + COLORS.length + ' 色';
            if (currentIndex >= 0) {
                Array.from(els.colorGrid.children).forEach(cell => {
                    cell.classList.toggle('active', parseInt(cell.dataset.index, 10) === currentIndex);
                });
            }
        }

        // ---- 事件 ----
        els.randomBtn.addEventListener('click', () => {
            applyTheme(Math.floor(Math.random() * COLORS.length));
            showToast('已随机配色');
        });
        els.copyMainBtn.addEventListener('click', () => copyHex(window.__currentHex));
        els.searchInput.addEventListener('input', renderGrid);

        // ---- 初始化：随机主色调 ----
        renderGrid();
        applyTheme(Math.floor(Math.random() * COLORS.length));
    </script>
    <script src="../script.js"></script>
</body>
</html>
