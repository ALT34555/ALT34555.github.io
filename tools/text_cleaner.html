<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中文文本清洗工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        main: '#8076a3',    // 主背景色
                        aux1: '#589c6c',    // 绿色辅助
                        aux2: '#e77c8e',    // 粉色辅助
                        dark: '#2d2a3d',    // 深色文字
                    }
                }
            }
        }
    </script>
    <style>
        /* 自定义滚动条样式 */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        textarea::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .checkbox-wrapper input:checked + div {
            background-color: #589c6c;
            border-color: #589c6c;
        }
        .checkbox-wrapper input:checked + div svg {
            display: block;
        }
    </style>
</head>
<body class="bg-main min-h-screen font-sans text-white p-4 md:p-8 flex flex-col items-center">

    <!-- 标题区 -->
    <header class="w-full max-w-6xl mb-6 flex justify-between items-end border-b border-white/20 pb-4">
        <div>
            <h1 class="text-3xl font-bold tracking-wide">LLM文本清理工具</h1>
            <p class="text-white/70 text-sm mt-1">Text Cleaning & Formatting Tool</p>
        </div>
        <div class="text-xs text-white/50">
            Greeting from Jiaoer
        </div>
    </header>

    <!-- 主工作区 -->
    <main class="w-full max-w-6xl flex flex-col lg:flex-row gap-6 h-[calc(100vh-160px)] min-h-[600px]">
        
        <!-- 输入区域 -->
        <section class="flex-1 flex flex-col bg-white/10 rounded-xl p-4 backdrop-blur-sm border border-white/10 shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <h2 class="font-semibold text-lg flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                    输入文本
                </h2>
                <button onclick="clearInput()" class="text-xs hover:text-aux2 transition-colors">清空</button>
            </div>
            <textarea id="inputArea" class="w-full flex-1 bg-black/20 rounded-lg p-4 text-white placeholder-white/30 outline-none focus:ring-2 focus:ring-aux1/50 transition-all resize-none text-base leading-relaxed" placeholder="在此粘贴需要处理的文本...&#10;例如：&#10;这是一个   测试文本,包含错误的\n换行和[img=...]标签。"></textarea>
        </section>

        <!-- 控制面板 -->
        <section class="lg:w-64 flex flex-col gap-4 shrink-0">
            <div class="bg-white rounded-xl p-5 text-dark shadow-xl">
                <h3 class="font-bold text-gray-700 mb-4 border-b pb-2">功能选项</h3>
                
                <div class="space-y-3">
                    <!-- 选项 1 -->
                    <label class="checkbox-wrapper flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" id="opt-spaces" checked class="hidden">
                        <div class="w-5 h-5 border-2 border-gray-300 rounded flex items-center justify-center transition-colors bg-white">
                            <svg class="w-3 h-3 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>
                        </div>
                        <span class="text-sm text-gray-700 group-hover:text-aux1 transition-colors">1. 格式修正 (空格/换行)</span>
                    </label>

                    <!-- 选项 2 -->
                    <label class="checkbox-wrapper flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" id="opt-format" checked class="hidden">
                        <div class="w-5 h-5 border-2 border-gray-300 rounded flex items-center justify-center transition-colors bg-white">
                            <svg class="w-3 h-3 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>
                        </div>
                        <span class="text-sm text-gray-700 group-hover:text-aux1 transition-colors">2. 修复 Markdown/JSON</span>
                    </label>

                    <!-- 选项 3 -->
                    <label class="checkbox-wrapper flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" id="opt-punct" checked class="hidden">
                        <div class="w-5 h-5 border-2 border-gray-300 rounded flex items-center justify-center transition-colors bg-white">
                            <svg class="w-3 h-3 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>
                        </div>
                        <span class="text-sm text-gray-700 group-hover:text-aux1 transition-colors">3. 修正全角标点</span>
                    </label>

                    <!-- 选项 4 -->
                    <label class="checkbox-wrapper flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" id="opt-cite" checked class="hidden">
                        <div class="w-5 h-5 border-2 border-gray-300 rounded flex items-center justify-center transition-colors bg-white">
                            <svg class="w-3 h-3 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>
                        </div>
                        <span class="text-sm text-gray-700 group-hover:text-aux1 transition-colors">4. 删除引用 [1]</span>
                    </label>

                    <!-- 选项 5 -->
                    <label class="checkbox-wrapper flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" id="opt-img" checked class="hidden">
                        <div class="w-5 h-5 border-2 border-gray-300 rounded flex items-center justify-center transition-colors bg-white">
                            <svg class="w-3 h-3 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>
                        </div>
                        <span class="text-sm text-gray-700 group-hover:text-aux1 transition-colors">5. 删除 [img=...]</span>
                    </label>
                </div>
            </div>

            <!-- 操作按钮 -->
            <button onclick="processText()" class="w-full bg-aux1 hover:bg-[#4a8a5d] text-white font-bold py-4 px-6 rounded-xl shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
                开始处理
            </button>
        </section>

        <!-- 输出区域 -->
        <section class="flex-1 flex flex-col bg-white/10 rounded-xl p-4 backdrop-blur-sm border border-white/10 shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <h2 class="font-semibold text-lg flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    处理结果
                </h2>
                <div id="msg" class="text-aux1 bg-white/90 px-2 py-0.5 rounded text-xs font-bold opacity-0 transition-opacity">已复制!</div>
            </div>
            <textarea id="outputArea" class="w-full flex-1 bg-black/20 rounded-lg p-4 text-white placeholder-white/30 outline-none focus:ring-2 focus:ring-aux2/50 transition-all resize-none text-base leading-relaxed" readonly placeholder="处理后的结果将显示在这里..."></textarea>
            
            <button onclick="copyOutput()" class="mt-4 w-full bg-aux2 hover:bg-[#d66a7c] text-white font-semibold py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" /></svg>
                复制结果
            </button>
        </section>
    </main>

    <script>
        function clearInput() {
            document.getElementById('inputArea').value = '';
            document.getElementById('inputArea').focus();
        }

        function processText() {
            let text = document.getElementById('inputArea').value;
            
            // 获取选项状态
            const optSpaces = document.getElementById('opt-spaces').checked;
            const optFormat = document.getElementById('opt-format').checked;
            // 修复：添加遗漏的变量定义
            const optPunct = document.getElementById('opt-punct').checked;
            const optCite = document.getElementById('opt-cite').checked;
            const optImg = document.getElementById('opt-img').checked;

            // 1. 格式修正 (空格/换行)
            if (optSpaces) {
                // 删除行首行尾空格
                text = text.replace(/^[ \t]+|[ \t]+$/gm, '');
                
                // 将多个连续空格/制表符替换为一个空格
                text = text.replace(/[ \t]{2,}/g, ' ');
                
                // 删除中文字符之间的空格
                text = text.replace(/([\u4e00-\u9fa5])\s+([\u4e00-\u9fa5])/g, '$1$2');

                // --- 新增：删除多余换行 ---
                
                // 1. 针对中文环境：如果换行符前后都是中文，通常是错误的硬回车，直接合并
                // 注意：这可能会误伤特意换行的诗歌等，但在"清洗"场景下通常是期望行为
                text = text.replace(/([\u4e00-\u9fa5])\n([\u4e00-\u9fa5])/g, '$1$2');

                // 2. 将连续的3个及以上换行符(即2个及以上空行)压缩为2个(1个空行，作为段落分隔)
                text = text.replace(/\n{3,}/g, '\n\n');
            }

            // 2. 删除/修复错误的格式 (Markdown/JSON)
            if (optFormat) {
                // 修复 JSON 风格的 \n 换行符
                text = text.replace(/\\n/g, '\n');
                // 修复错误的加粗格式
                // 修复: ** 文字 ** -> **文字**
                text = text.replace(/\*\*\s+(.*?)\s+\*\*/g, '**$1**');
                // 修复: 连用的空加粗 **** 或 ** ** -> 删除
                text = text.replace(/\*\*\s*\*\*/g, '');
                // 修复: 只有一半的加粗符号，例如行尾的 ** (简单处理)
                // text = text.replace(/\*\*(?!\S)/g, ''); 
            }

            // 4. 删除 cite 引用 (顺序提前以免影响标点判断)
            if (optCite) {
                // 删除 [1], [12], [cite] 等
                text = text.replace(/\[\s*(\d+|cite.*?)\s*\]/gi, '');
                // 删除上标样式的引用，如果格式是 <sup>[1]</sup> 这种HTML
                text = text.replace(/<sup>\s*\[\d+\]\s*<\/sup>/gi, '');
            }

            // 5. 删除 [img=...]
            if (optImg) {
                text = text.replace(/\[img=.*?\]/gi, '');
            }

            // 3. 修正标点 (最后处理，保证文本流整洁)
            if (optPunct) {
                // 基础标点替换 (半角 -> 全角)
                // 注意：为了不破坏英文数字(如 1,000)或英文代码，我们通常判断前后是否有中文
                // 或者是强制转换。这里采用"主要针对中文语境"的策略。
                
                // 替换半角逗号，如果后面不是数字（防止破坏 1,000）
                text = text.replace(/,(?!\d)/g, '，');
                
                // 替换半角句号，如果后面不是数字或英文字母（防止破坏 IP地址或文件名）
                // 简单起见，通常直接替换 ., ?, ! 
                // 但为了更智能，我们把 连续的英文.保留 (省略号处理在后面)
                
                // 修复 "..." 为 "……"
                text = text.replace(/\.{3,}|…{2,}|。。。/g, '……');

                // 替换问号和感叹号
                text = text.replace(/\?/g, '？');
                text = text.replace(/!/g, '！');

                // 替换句号 (排除数字中间的小数点 3.14)
                text = text.replace(/(?<!\d)\.(?!\d)/g, '。');

                // 修正冒号和分号
                text = text.replace(/:/g, '：'); 
                // 注意: HTTP链接 (http:) 会被破坏。如果需要保护链接，逻辑会更复杂。
                // 简单恢复 http： -> http:
                text = text.replace(/(https?|ftp|file)：/gi, '$1:');

                text = text.replace(/;/g, '；');
                // 恢复 HTML 实体 (如 &nbsp； -> &nbsp;)
                text = text.replace(/&([a-z0-9]+)；/gi, '&$1;');

                // 修正括号
                text = text.replace(/\(/g, '（').replace(/\)/g, '）');

                // 修正双引号 "" -> “”
                // 逻辑：维护一个开关，或者使用正则匹配成对
                // 方法A：先修复打反的 “...” ” -> “...”
                // 很多时候错误是： ”文字“ (反了) 或者 全是直角引号 "文字"
                
                // 1. 将所有现存的中文引号统一转为直角引号 " (临时)
                text = text.replace(/[“”]/g, '"');
                
                // 2. 将成对的 "内容" 替换为 “内容”
                // 使用循环替换以处理嵌套或多组
                let quoteOpen = true;
                // 简单的状态机替换
                let newText = "";
                for (let i = 0; i < text.length; i++) {
                    let char = text[i];
                    if (char === '"') {
                        // 如果是引号，判断是开还是关
                        // 简单启发式：如果前一个字符是换行、空格、标点，或者是开头，通常是左引号
                        if (quoteOpen) {
                            newText += '“';
                            quoteOpen = false;
                        } else {
                            newText += '”';
                            quoteOpen = true;
                        }
                    } else {
                        newText += char;
                        // 如果遇到换行，通常重置引号逻辑 (防止跨段落错误)
                        if (char === '\n') quoteOpen = true; 
                    }
                }
                text = newText;
            }

            document.getElementById('outputArea').value = text;
        }

        function copyOutput() {
            const output = document.getElementById('outputArea');
            output.select();
            document.execCommand('copy'); // 兼容性更好的写法
            
            // 显示提示
            const msg = document.getElementById('msg');
            msg.classList.remove('opacity-0');
            setTimeout(() => {
                msg.classList.add('opacity-0');
            }, 2000);
        }
    </script>
</body>
</html>
