<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 校验</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: 'var(--accent-color)',
                        bg: 'var(--bg-color)',
                        redAlert: '#CB3A56',
                        redDark: '#82111f',
                        blueAlt: 'var(--header-text-color)',
                        whiteAlt: 'var(--border-color)',
                        blackAlt: 'var(--text-color)'
                    }
                }
            }
        }
    </script>
    <style>
        .code-font {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }
        textarea:focus {
            outline: none;
        }
        * {
          border-radius: 0 !important;
          /* 全局取消圆角 */
        }
        .mode-square-btn {
          width: 24px;
          height: 24px;
          border: 1px solid var(--border-color);
          background: var(--bg-color);
          color: var(--text-color);
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 0;
          cursor: pointer;
        }
        /* Clean Toolbar without backgrounds */
        .clean-toolbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: flex-end;
            padding: 10px 20px;
            z-index: 50;
        }

        .clean-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .tone-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 0;
        }

        #mode-toggle {
            background: transparent;
            border: none;
            box-shadow: none;
            font-size: 1rem;
            padding: 2px;
            cursor: pointer;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #mode-toggle:hover {
            transform: scale(1.1);
            background: transparent;
            box-shadow: none;
        }

        .glass-panel-inner {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid var(--border-color);
        }
        
        .dark-mode-panel {
            background: rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden">
    <!-- Top Right Toolbar -->
    

    <!-- Main App Window -->
    
    <!-- Global App Window Titlebar -->
    <div class="window-titlebar" style="border-top: none; border-left: none; border-right: none;">
        <div class="title-content">
            <span class="window-icon" style="font-size:1rem; font-weight:800; font-family:monospace;">{ JSN }</span>
            <h2 class="window-title" style="font-size:1rem;">JSON 校验与修复</h2>
        </div>
        <div class="window-controls theme-controls">
            <input type="range" min="-1" max="1" step="1" class="tone-slider" title="调整冷暖色调">
            <div class="mode-square-btn" title="切换深浅色">▢</div>
            <div class="mode-square-btn" style="background:var(--accent-color); color:#fff; border-color:var(--accent-color);" onclick="window.location.href='../index.html'" title="返回首页">⚪</div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 p-4 md:p-6 flex flex-col gap-4 overflow-hidden">

                <!-- Action Bar -->
                <div class="flex flex-wrap gap-3">
                    <button onclick="formatJSON()" class="flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" /></svg>
                        格式化
                    </button>
                    <button onclick="autoFixJSON()" class="flex items-center gap-1 !bg-theme !text-white !border-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                        自动修复
                    </button>
                    <button onclick="removeComments()" class="flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z" /></svg>
                        去注释
                    </button>
                    <button onclick="clearAll()" class="flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        清空
                    </button>
                </div>

                <!-- Content Area -->
                <main class="flex-1 flex flex-col md:flex-row gap-4 overflow-hidden">
                    
                    <!-- 左侧输入区 -->
                    <div class="flex-1 flex flex-col overflow-hidden relative shadow-sm glass-card ">
                        <div class="bg-theme/10 text-theme px-4 py-2 border-b border-theme/20 text-sm font-bold flex justify-between items-center z-10 backdrop-blur-sm">
                            <span>输入 JSON 代码</span>
                            <button onclick="copyInput()" class="!bg-transparent !border-none !shadow-none !p-1 hover:text-theme transition-colors text-xs" title="复制内容">复制</button>
                        </div>
                        <textarea id="jsonInput" 
                                class="flex-1 w-full bg-transparent p-4 resize-none code-font text-sm text-blackAlt leading-relaxed"
                                placeholder="在此粘贴您的 JSON 代码...&#10;支持自动检测语法错误并高亮显示。"
                                spellcheck="false"></textarea>
                    </div>

                    <!-- 结果区 -->
                    <div class="flex-1 flex flex-col overflow-hidden relative shadow-sm glass-card ">
                        <!-- 状态横幅 -->
                        <div id="statusBanner" class="px-4 py-2 border-b border-theme/20 text-sm font-bold flex justify-between items-center bg-theme/10 text-theme z-10 backdrop-blur-sm">
                            <div class="flex items-center gap-2">
                                <span id="statusIcon">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                </span>
                                <span id="statusText">等待输入...</span>
                            </div>
                            <button onclick="copyOutput()" id="copyBtn" class="hidden !bg-transparent !border-none !shadow-none !p-1 hover:text-theme transition-colors text-xs">复制结果</button>
                        </div>

                        <!-- 输出内容展示区 -->
                        <div class="flex-1 overflow-auto p-4 relative dark-mode-panel">
                            <div id="successOutput" class="hidden code-font text-sm leading-relaxed text-blackAlt whitespace-pre-wrap break-all"></div>
                            
                            <div id="errorOutput" class="hidden flex flex-col gap-3">
                                <div class="bg-redAlert/10 border-l-4 border-redAlert p-3  text-redDark font-medium text-sm code-font" id="errorMsg">
                                </div>
                                <div class="text-sm font-bold text-blackAlt mt-2 mb-1">错误上下文定位：</div>
                                <div id="errorContext" class=" overflow-x-auto shadow-sm glass-card ">
                                </div>
                                <div class="mt-4 p-3 bg-blueAlt/10  border border-blueAlt/20 text-sm text-blueAlt">
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <script>
        const DOM = {
            input: document.getElementById('jsonInput'),
            statusBanner: document.getElementById('statusBanner'),
            statusText: document.getElementById('statusText'),
            statusIcon: document.getElementById('statusIcon'),
            successOutput: document.getElementById('successOutput'),
            errorOutput: document.getElementById('errorOutput'),
            errorMsg: document.getElementById('errorMsg'),
            errorContext: document.getElementById('errorContext'),
            copyBtn: document.getElementById('copyBtn')
        };

        let debounceTimer;
        DOM.input.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            if (!DOM.input.value.trim()) {
                resetUI();
                return;
            }
            debounceTimer = setTimeout(() => {
                validateJSON();
            }, 500);
        });

        function validateJSON() {
            const rawText = DOM.input.value.trim();
            if (!rawText) return;
            try {
                const parsed = JSON.parse(rawText);
                showSuccess(parsed);
            } catch (err) {
                showError(err, rawText);
            }
        }

        function showError(error, text) {
            const errorStr = error.message;
            let line = 1, col = 1, pos = -1;

            let match = errorStr.match(/position\s+(\d+)/i);
            if (match) {
                pos = parseInt(match[1], 10);
                const upToError = text.substring(0, pos);
                const lines = upToError.split('\n');
                line = lines.length;
                col = lines[lines.length - 1].length + 1;
            } else {
                match = errorStr.match(/line\s+(\d+)\s+column\s+(\d+)/i);
                if (match) {
                    line = parseInt(match[1], 10);
                    col = parseInt(match[2], 10);
                }
            }

            DOM.statusBanner.className = 'px-4 py-2 border-b border-theme/20 text-sm font-bold flex justify-between items-center bg-redAlert/20 text-redAlert z-10 backdrop-blur-sm';
            DOM.statusText.innerHTML = `语法错误 (行 ${line}, 列 ${col})`;
            DOM.statusIcon.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            DOM.copyBtn.classList.add('hidden');

            DOM.successOutput.classList.add('hidden');
            DOM.errorOutput.classList.remove('hidden');
            DOM.errorMsg.textContent = errorStr;

            DOM.errorContext.innerHTML = renderErrorContext(text, line, col);
        }

        function renderErrorContext(text, line, col) {
            const lines = text.split('\n');
            const startLine = Math.max(0, line - 3);
            const endLine = Math.min(lines.length - 1, line + 1);

            let html = '<div class="code-font text-sm py-2">';
            for (let i = startLine; i <= endLine; i++) {
                const lineNum = i + 1;
                const content = lines[i].replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                const isErrorLine = (lineNum === line);

                if (isErrorLine) {
                    let safeContent = content;
                    const charIdx = col - 1;
                    if (charIdx < content.length) {
                        safeContent = content.substring(0, charIdx) +
                                      `<span class="bg-redAlert text-white font-bold px-[2px]  animate-pulse" title="错误可能发生在这里">${content.charAt(charIdx) || ' '}</span>` +
                                      content.substring(charIdx + 1);
                    } else {
                        safeContent = content + `<span class="bg-redAlert text-white font-bold px-[2px]  animate-pulse" title="错误可能发生在这里">↵</span>`;
                    }

                    html += `<div class="bg-redAlert/10 flex border-l-4 border-redAlert">
                                <div class="w-10 text-right pr-2 text-redAlert font-bold select-none opacity-80 pt-[2px] pb-[2px]">${lineNum}</div>
                                <div class="flex-1 whitespace-pre-wrap pl-2 pt-[2px] pb-[2px] text-redDark break-all">${safeContent}</div>
                             </div>`;
                } else {
                    html += `<div class="flex border-l-4 border-transparent hover:bg-black/5">
                                <div class="w-10 text-right pr-2 text-theme font-medium select-none opacity-50 pt-[2px] pb-[2px]">${lineNum}</div>
                                <div class="flex-1 whitespace-pre-wrap pl-2 pt-[2px] pb-[2px] text-blackAlt opacity-80 break-all">${content}</div>
                             </div>`;
                }
            }
            html += '</div>';
            return html;
        }

        function showSuccess(parsedObj) {
            const prettyJSON = JSON.stringify(parsedObj, null, 4);
            
            DOM.statusBanner.className = 'px-4 py-2 border-b border-theme/20 text-sm font-bold flex justify-between items-center bg-blueAlt/20 text-theme z-10 backdrop-blur-sm';
            DOM.statusText.textContent = 'JSON 校验通过，格式有效';
            DOM.statusIcon.innerHTML = `<svg class="w-5 h-5 text-theme" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            DOM.copyBtn.classList.remove('hidden');

            DOM.errorOutput.classList.add('hidden');
            DOM.successOutput.classList.remove('hidden');
            
            DOM.successOutput.innerHTML = syntaxHighlight(prettyJSON);
        }

        function syntaxHighlight(json) {
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'text-[#d97736]'; 
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'text-theme font-bold';
                    } else {
                        cls = 'text-redAlert';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'text-blueAlt font-bold';
                } else if (/null/.test(match)) {
                    cls = 'text-blackAlt opacity-60 italic';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        function formatJSON() {
            const rawText = DOM.input.value.trim();
            if (!rawText) return;
            try {
                const parsed = JSON.parse(rawText);
                DOM.input.value = JSON.stringify(parsed, null, 4);
                validateJSON();
            } catch (err) {
                validateJSON();
            }
        }

        function autoFixJSON() {
            let rawText = DOM.input.value.trim();
            if (!rawText) return;
            rawText = rawText.replace(/(["'])(.*?)\1/g, (match, quote, innerStr) => {
                if (/[a-zA-Z]:\\/.test(innerStr) || /\\([^\\/"\\bfnrtu])/.test(innerStr)) {
                    return quote + innerStr.replace(/\\/g, '/') + quote;
                }
                return match;
            });
            DOM.input.value = rawText; 

            try {
                JSON.parse(rawText);
                formatJSON(); 
                toast("JSON 已经是正确的，已为您格式化。");
                return;
            } catch (e) {}

            try {
                const fixedObj = new Function('return (' + rawText + ')')();
                const standardJSON = JSON.stringify(fixedObj, null, 4);
                DOM.input.value = standardJSON;
                validateJSON();
                toast("自动修复成功！");
            } catch (err) {
                toast("QAQ 啊这，我不会了", true);
                validateJSON();
            }
        }

        function removeComments() {
            let rawText = DOM.input.value;
            if (!rawText) return;

            const newText = rawText.replace(/("([^"\\\\]*(\\\\.)?)*")|('([^'\\\\]*(\\\\.)?)*')|(\\/\\*[\\s\\S]*?\\*\\/|\\/\\/.*)/g, (match, doubleQuoteStr, p2, p3, singleQuoteStr, p5, p6, comment) => {
                if (doubleQuoteStr) return doubleQuoteStr;
                if (singleQuoteStr) return singleQuoteStr;
                return '';
            });

            if (newText !== rawText) {
                DOM.input.value = newText;
                validateJSON();
                toast("✅ 已成功提取并移除注释！");
            } else {
                toast("ℹ️ 未发现需要移除的注释。");
            }
        }

        function resetUI() {
            DOM.input.value = '';
            DOM.statusBanner.className = 'px-4 py-2 border-b border-theme/20 text-sm font-bold flex justify-between items-center bg-theme/10 text-theme z-10 backdrop-blur-sm';
            DOM.statusText.textContent = '等待输入...';
            DOM.statusIcon.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            DOM.successOutput.classList.add('hidden');
            DOM.errorOutput.classList.add('hidden');
            DOM.copyBtn.classList.add('hidden');
        }

        function clearAll() {
            resetUI();
            DOM.input.focus();
        }

        function copyInput() {
            if(!DOM.input.value) return;
            navigator.clipboard.writeText(DOM.input.value).then(() => toast('源码已复制！'));
        }

        function copyOutput() {
            const text = DOM.successOutput.innerText;
            if(!text) return;
            navigator.clipboard.writeText(text).then(() => toast('校验结果已复制！'));
        }

        function toast(msg, isError = false) {
            const toastEl = document.createElement('div');
            toastEl.className = `fixed top-6 left-1/2 transform -translate-x-1/2 px-6 py-3  shadow-xl text-white text-sm font-bold z-[100] transition-all duration-300 ${isError ? 'bg-redAlert' : 'bg-theme'}`;
            toastEl.textContent = msg;
            document.body.appendChild(toastEl);
            
            setTimeout(() => {
                toastEl.style.opacity = '0';
                toastEl.style.transform = 'translate(-50%, -20px)';
                setTimeout(() => toastEl.remove(), 300);
            }, 2500);
        }

        window.onload = () => {
            DOM.input.value = `{\\n  // 项目名称\\n  name: 'JSON 工具',\\n  /*\\n    特性列表\\n  */\\n  "features": [\\n    "错误定位",\\n    "自动修复",\\n    "语法高亮",\\n  ],\\n  "path": "E:\\\\\\\\文件夹1\\\\\\\\文件夹2",\\n  "isValid": false\\n}`;
            validateJSON();
        }
    </script>
    <script src="../script.js"></script>
</body>
</html>
